{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Site{% endblock %}</title>
    <link rel="stylesheet" href="{% static "webserver/css/style.css" %}">
    <script src="https://kit.fontawesome.com/cd39f42707.js" crossorigin="anonymous"></script>
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <div class="collapse navbar-collapse justify-content-end navigation" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                            <span class="icon">
                                <i class="fa-solid fa-home"></i>
                            </span>
                            <span class="title">Home</span>
                        </a>
                    </li>
                    {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/diagnostic/' %}active{% endif %}" href="/diagnostic">
                            <span class="icon">
                                <i class="fa-solid fa-stethoscope"></i>
                            </span>
                            <span class="title">Diagnostic</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/profile/' %}active{% endif %}" href="/profile/">
                            <span class="icon">
                                <i class="fa-solid fa-user"></i>
                            </span>
                            <span class="title">profile</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/logout/' %}active{% endif %}" href="/logout/">
                            <span class="icon">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                            </span>
                            <span class="title">Logout</span>
                        </a>
                    </li>
                    {% endif %}
                    {% if not user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/login/' %}active{% endif %}" href="/login/">
                            <span class="icon">
                                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                            </span>
                            <span class="title">Login</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/signin/' %}active{% endif %}" href="/signin/">
                            <span class="icon">
                                <i class="fa-solid fa-user-plus"></i>
                            </span>
                            <span class="title">Sing Up</span>
                        </a>
                    </li>
                    {% endif %}                    
                </ul>
            </div>
        </div>
    </nav>
    <!-- Contenido principal -->
    <main class="container mt-4 flex-grow-1">
        <div class="topbar">
            <div class="toggle">
                <i class="fa-solid fa-bars"></i>
            </div>
            <a class="navbar-brand" href="#">RDR</a>
        </div>

        {% block content %}
        {% endblock %}
    </main>
    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <div class="container">
            <p>RDR 2024</p>
        </div>
    </footer>
    <script>
        // Add hovered class to selected list item
        let list = document.querySelectorAll(".navigation li");
    
        function activeLink() {
            list.forEach((item) => {
                item.classList.remove("hovered");
            });
            this.classList.add("hovered");
        }
    
        list.forEach((item) => item.addEventListener("mouseover", activeLink));
    
        // Menu Toggle
        let toggle = document.querySelector(".toggle");
        let navigation = document.querySelector(".navigation");
        let main = document.querySelector("main");
    
        toggle.onclick = function () {
            navigation.classList.toggle("active");
            main.classList.toggle("active");
        };
    
        // Sections
        let paciente = document.getElementById("patient-card");
        let diagnostico = document.getElementById("diagnostic-card");
        let historial = document.getElementById("history-card");
    
        // Buttons
        let btn_paciente = document.querySelector(".btn-pacient");
        let btn_diagnostico = document.querySelector(".btn-diagnostic");
        let btn_historial = document.querySelector(".btn-historial");
    
        // Initial State
        paciente.style.display = "block";
        diagnostico.style.display = "none";
        historial.style.display = "none";
    
        // Functions to switch tabs and update server state
        async function switchTab(tabName) {
            // Update the visible section
            if (tabName === "diagnostic-card") {
                diagnostico.style.display = "block";
                paciente.style.display = "none";
                historial.style.display = "none";
            } else if (tabName === "history-card") {
                diagnostico.style.display = "none";
                paciente.style.display = "none";
                historial.style.display = "block";
            } else {
                diagnostico.style.display = "none";
                paciente.style.display = "block";
                historial.style.display = "none";
            }
    
            // Send the active tab to the server
            try {
                await fetch("/save-active-tab/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCsrfToken(),
                    },
                    body: JSON.stringify({ active_tab: tabName }),
                });
            } catch (error) {
                console.error("Error saving active tab:", error);
            }
        }
    
        // Functions to handle button clicks
        btn_diagnostico.onclick = function () {
            switchTab("diagnostic-card");
        };
    
        btn_historial.onclick = function () {
            switchTab("history-card");
        };
    
        btn_paciente.onclick = function () {
            switchTab("patient-card");
        };
    
        // Fetch the active tab from the server on page load
        async function initializeActiveTab() {
            try {
                const response = await fetch("/save-active-tab/");
                const data = await response.json();
                const activeTab = data.active_tab || "patient-card";
                console.log("active_tab: ", activeTab);
                switchTab(activeTab);
            } catch (error) {
                console.error("Error fetching active tab:", error);
                switchTab("patient-card"); // Default to patient-card on error
            }
        }
    
        // CSRF Token Helper
        function getCsrfToken() {
            return document.querySelector("[name=csrfmiddlewaretoken]").value;
        }
    
        // Initialize the active tab on page load
        document.addEventListener("DOMContentLoaded", initializeActiveTab);

        async function loadPatientData(patientId) {
            try {
                // Fetch patient data
                const response = await fetch(`/get-patient-data/${patientId}/`);
                if (!response.ok) {
                    throw new Error("Error al obtener los datos del paciente.");
                }
        
                const data = await response.json();
        
                // Actualizar campos del formulario de paciente
                document.querySelector('[name="first_name"]').value = data.first_name;
                document.querySelector('[name="last_name"]').value = data.last_name;
                document.querySelector('[name="age"]').value = data.age;
                document.querySelector('[name="birth_date"]').value = data.birth_date;
                document.querySelector('[name="medical_history"]').value = data.medical_history;
                document.querySelector('[name="contact"]').value = data.contact;
        
                // Set selected patient on the backend
                await setSelectedPatient(patientId);
        
                // Cambiar a la pestaña "patient-card"
                switchTab("patient-card");
        
                // Actualizar botones dinámicamente para edición
                document.querySelector('input[name="patient_id"]').value = patientId;
                document.querySelectorAll('.btn-secondary, .btn-danger').forEach(btn => {
                    btn.style.display = "inline-block";
                });
            } catch (error) {
                console.error("Error al cargar los datos del paciente:", error);
            }
        }
        
        async function setSelectedPatient(patientId) {
            try {
                const response = await fetch('/set-selected-patient/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken(),
                    },
                    body: JSON.stringify({ patient_id: patientId }),
                });
                if (!response.ok) {
                    throw new Error("Error al establecer el paciente seleccionado.");
                }
            } catch (error) {
                console.error("Error al establecer el paciente seleccionado:", error);
            }
        }
        
    </script>
</body>
</html>
